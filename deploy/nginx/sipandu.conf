# ==============================================================================
# Nginx Configuration for SIPANDU Rindam III/Siliwangi (Laravel 11 / PHP 8.3)
# Simpan di: /etc/nginx/sites-available/sipandu
# Tautkan ke: /etc/nginx/sites-enabled/sipandu
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN_OR_IP}};

    # Root direktori Laravel (Wajib mengarah ke folder public)
    root /var/www/sipandu/public;
    index index.php index.html index.htm;

    # Karakter encoding default
    charset utf-8;

    # Batas ukuran upload berkas (untuk foto siswa, impor Excel Dapokdikma)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Log Nginx
    access_log /var/log/nginx/sipandu_access.log combined buffer=64k flush=5m;
    error_log  /var/log/nginx/sipandu_error.log warn;

    # Header Keamanan
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Routing Laravel Utama
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Blok PHP-FPM
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        
        # Buffer & Timeout untuk eksekusi query besar atau impor Excel
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_intercept_errors off;
    }

    # Optimasi Aset Statis (Vite / Build / CSS / JS / Media)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Khusus PWA Manifest & Service Worker (Jangan di-cache agresif agar pembaruan cepat)
    location ~* (manifest\.json|sw\.js)$ {
        expires -1;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Keamanan: Tolak akses berkas tersembunyi (seperti .git, .env, dll)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Keamanan Ekstra: Larang langsung akses file database, log, dan backup
    location ~ \.(sqlite|sqlite3|db|env|log|bak|sql|sh|bat)$ {
        deny all;
        return 404;
    }

    # Endpoint Favicon & Robots.txt
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
