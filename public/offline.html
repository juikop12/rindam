<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus — SIPANDU Rindam III/Siliwangi</title>
    <meta name="theme-color" content="#0F172A">
    <link rel="icon" type="image/png" href="/img/icons/icon-192x192.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #1E293B;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
            padding: 36px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .logo {
            width: 84px;
            height: 84px;
            margin: 0 auto 20px;
            display: block;
            filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.25));
        }
        .icon-signal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            font-size: 24px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #FFFFFF;
        }
        p {
            font-size: 13.5px;
            color: #94A3B8;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #0F172A;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            color: #F59E0B;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 13px 20px;
            background: #F59E0B;
            color: #0F172A;
            font-weight: 800;
            font-size: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #D97706;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/img/icons/icon-192x192.png" alt="Logo Rindam" class="logo">
        <div class="badge">Sistem SIPANDU-WBK</div>
        <h1>Perangkat Sedang Offline</h1>
        <p>Koneksi internet atau intranet militer terputus. Silakan periksa jaringan Wi-Fi/Data Seluler Anda, lalu muat ulang halaman.</p>
        <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
</body>
</html>
